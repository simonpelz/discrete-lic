<!doctype html>
<!-- Headless test harness: drives the real pipeline so Playwright can screenshot
     the canvas for fidelity comparison against the Python CLI references.
     Not part of the shipped site. -->
<html>
<head><meta charset="utf-8"><title>LIC fidelity harness</title>
<style>html,body{margin:0;background:#000}#c{display:block}</style></head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script type="module">
import * as pipeline from "../gl/pipeline.js";

const canvas = document.getElementById("c");
let ctx = null, initError = null;
try { ctx = pipeline.init(canvas); }
catch (e) { initError = String(e && e.message || e); }

// Exposed to Playwright. Renders one param set and resolves with the canvas
// PNG data URL (so we can save it and diff against the Python reference).
window.licRender = async (params) => {
  if (initError) return { error: initError };
  try {
    const mode = (params.pixel_mode === "voronoi") ? "renderVoronoi" : "renderGrid";
    await pipeline[mode](ctx, params);
    // Force completion before reading pixels.
    ctx.gl.finish();
    return { dataUrl: canvas.toDataURL("image/png"),
             w: canvas.width, h: canvas.height };
  } catch (e) {
    return { error: String(e && e.stack || e) };
  }
};

window.__harnessReady = true;
window.__initError = initError;
</script>
</body>
</html>

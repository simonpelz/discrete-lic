<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>discrete-lic — generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="top">
  <a class="name" href="../">discrete&#8209;lic<span class="mark" aria-hidden="true"><i></i><i></i><i></i></span></a>
  <nav>
    <button class="tab active" data-panel="panel-generator">Generator</button>
    <button class="tab" data-panel="panel-gallery">Plates</button>
  </nav>
</header>

<!-- ── Generator ────────────────────────────────────────────── -->

<main class="panel active" id="panel-generator">
  <div class="generator-layout">

    <form class="controls" onsubmit="return false">

      <fieldset>
        <legend>Field</legend>

        <div class="control-group">
          <label for="field-select">Vector field</label>
          <select id="field-select">
            <option value="rotation">rotation</option>
            <option value="perlin_curl">perlin_curl</option>
            <option value="double_vortex">double_vortex</option>
            <option value="spiral">spiral</option>
            <option value="wave">wave</option>
            <option value="saddle">saddle</option>
            <option value="source">source</option>
            <option value="sink">sink</option>
            <option value="shear">shear</option>
            <option value="uniform">uniform</option>
            <option value="complex">complex (custom)</option>
            <option value="mhd_cluster">mhd_cluster (yt)</option>
            <option value="wd_merger">wd_merger (yt)</option>
          </select>
        </div>

        <div class="control-group collapsible hidden" id="complex-row">
          <label for="field-expr">f(z)</label>
          <input type="text" id="field-expr" value="z**2" placeholder="z**2, np.sin(z*4), 1/z" spellcheck="false">
        </div>

        <p id="yt-notice" class="note collapsible hidden">
          This field comes from a simulation snapshot, exported offline with yt.
          If the asset is missing it falls back quietly.
        </p>
      </fieldset>

      <fieldset>
        <legend>Colour</legend>

        <div class="control-group">
          <label for="color-select">Mode</label>
          <select id="color-select">
            <option value="pure_rgb">pure_rgb — three primaries</option>
            <option value="angle_hsv">angle_hsv — hue from direction</option>
            <option value="colormap">colormap — matplotlib</option>
            <option value="rgb">rgb — direct colour LIC</option>
            <option value="hsv_noise">hsv_noise — LIC on value</option>
          </select>
        </div>

        <div class="collapsible" id="pure-opts">
          <div class="control-group">
            <label for="pure-mode-select">Sampling</label>
            <select id="pure-mode-select">
              <option value="stochastic">stochastic, per pixel</option>
              <option value="streamline">streamline, fibre-painted</option>
            </select>
          </div>
          <div class="control-group">
            <label for="sharpen-slider">Sharpness</label>
            <div class="slider-row">
              <input type="range" id="sharpen-slider" min="1" max="10" step="0.5" value="2.5">
              <span class="slider-val">2.5</span>
            </div>
          </div>
        </div>

        <div class="control-group collapsible hidden" id="colormap-row">
          <label for="colormap-select">Colormap</label>
          <select id="colormap-select">
            <option>viridis</option><option>plasma</option><option>inferno</option>
            <option>magma</option><option>cividis</option><option>turbo</option>
            <option>coolwarm</option><option>RdYlBu</option><option>Spectral</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Pixels</legend>

        <div class="control-group">
          <span class="label">Shape</span>
          <div class="toggle-row" role="group" aria-label="Pixel mode">
            <button type="button" class="toggle-btn active" data-mode="voronoi">Voronoi cells</button>
            <button type="button" class="toggle-btn" data-mode="grid">Square grid</button>
          </div>
        </div>

        <div class="control-group" id="voronoi-cells-row">
          <label for="cells-slider">Cells</label>
          <div class="slider-row">
            <input type="range" id="cells-slider" min="100" max="100000" step="100" value="800">
            <span class="slider-val">800</span>
          </div>
        </div>

        <div class="control-group">
          <label for="noise-select">Noise</label>
          <select id="noise-select">
            <option value="white_rgb">white_rgb</option>
            <option value="white">white</option>
            <option value="pure_rgb">pure_rgb</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Convolution</legend>

        <div class="control-group">
          <label for="steps-slider">Steps</label>
          <div class="slider-row">
            <input type="range" id="steps-slider" min="5" max="80" step="5" value="30">
            <span class="slider-val">30</span>
          </div>
        </div>

        <div class="control-group">
          <label for="kernel-select">Kernel</label>
          <select id="kernel-select">
            <option value="box">box</option>
            <option value="gaussian">gaussian</option>
            <option value="raised_cosine">raised_cosine</option>
          </select>
        </div>

        <div class="control-group collapsible hidden" id="kernel-sigma-row">
          <label for="kernel-sigma-slider">Sigma</label>
          <div class="slider-row">
            <input type="range" id="kernel-sigma-slider" min="0.05" max="1" step="0.05" value="0.3">
            <span class="slider-val">0.3</span>
          </div>
        </div>

        <div class="control-group">
          <label for="boundary-select">Edges</label>
          <select id="boundary-select">
            <option value="nearest">nearest (clamp)</option>
            <option value="wrap">wrap</option>
          </select>
        </div>

        <div class="control-group">
          <label for="enhance-select">Contrast</label>
          <select id="enhance-select">
            <option value="stretch">stretch</option>
            <option value="equalize">equalize</option>
            <option value="gamma">gamma</option>
            <option value="none">none</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Output</legend>

        <div class="control-group">
          <label for="width-input">Size</label>
          <div class="size-row">
            <input type="number" id="width-input" value="600" min="64" max="1024" step="64" aria-label="Width in pixels">
            <span>×</span>
            <input type="number" id="height-input" value="600" min="64" max="1024" step="64" aria-label="Height in pixels">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="control-group">
          <label for="seed-input">Seed</label>
          <input type="number" id="seed-input" value="42">
        </div>
      </fieldset>

      <button type="button" class="btn-generate" id="btn-generate">Render</button>
      <p class="hint">After the first render, changes redraw on their own.</p>
    </form>

    <section class="result-area" aria-live="polite">
      <figure class="result-stage" id="result-stage">
        <div class="result-placeholder" id="result-placeholder">
          <span>Nothing yet. Set the controls and press Render.</span>
        </div>
        <canvas class="result-canvas" id="result-canvas" style="display:none"></canvas>
        <figcaption class="result-caption">
          <span id="result-title"></span>
          <span class="status-text" id="status-text"></span>
        </figcaption>
      </figure>
      <div class="result-actions" id="result-actions" style="display:none">
        <a class="btn-download" id="btn-download" href="#" download="lic.png">Save as PNG</a>
      </div>
    </section>

  </div>
</main>

<!-- ── Plates ───────────────────────────────────────────────── -->

<section class="panel" id="panel-gallery">
  <div class="gallery-grid" id="gallery-grid">
    <p class="muted">Loading…</p>
  </div>
</section>

<!-- ── Lightbox ─────────────────────────────────────────────── -->

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" id="lightbox-close">Close</button>
  <img id="lightbox-img" src="" alt="">
  <p class="lightbox-cap" id="lightbox-cap"></p>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
